<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio - Ramon L. Diaz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/PortfolioGame/assets/css/main.css"/>
</head>
<body>

  {% include nav.html %}

  <div class="container py-5 mt-5">
    <h2 class="mb-5">Portfolio</h2>
    <div class="row g-4">
      {% for item in site.portfolio %}
      <div class="col-md-6 col-lg-4">
        <div class="project-card p-3 h-100">
          <h5>{{ item.title }}</h5>
          <p class="tags">{{ item.tags | join: " - " }}</p>
          <p>{{ item.excerpt }}</p>
          <a href="/PortfolioGame{{ item.url }}">View Project</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  {% include footer.html %}

</body>
</html>
